services:
  # Barramento Erlang (ems-bus)
  ems-bus:
    image: hub.sti.unb.br/sas/erlangms:v2026v22
    container_name: ems-bus
    hostname: node01
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2301:2301"
      - "2344:2344"
    volumes:
      - ./priv/conf:/app/lib/ems_bus-2.0.26/priv/conf
    networks:
      - erlangms
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2301/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

