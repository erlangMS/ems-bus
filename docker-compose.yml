services:
  # Barramento Erlang (ems-bus)
  ems-bus:
    image: evertonagilar/erlangms:v2026.1
    container_name: ems-bus
    hostname: node01
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "192.168.1.9:2301:2301"
      - "192.168.1.9:2344:2344"
    volumes:
      # Mount configuration directory
      - ./priv/conf:/app/lib/ems_bus-2.0.26/priv/conf
    networks:
      - erlangms
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2301/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Dashboard
  dashboard:
    image: evertonagilar/erlangms-dashboard:v2026.1
    container_name: ems-dashboard
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "192.168.1.9:5000:5000"
    environment:
      # OAuth2 settings
      - OAUTH2_CLIENT_ID=1
      - OAUTH2_CLIENT_SECRET=CPD
      - OAUTH2_AUTHORIZE_URL=http://192.168.1.9:2301/authorize
      - OAUTH2_TOKEN_URL=http://192.168.1.9:2301/authorize
      - OAUTH2_REDIRECT_URI=http://192.168.1.9:5000/callback
      - OAUTH2_SCOPE=user_fs
      
      # CORS configuration (comma-separated list of allowed origins)
      - CORS_ALLOWED_ORIGINS=http://192.168.1.9:2301,http://192.168.1.9:5000
      
      # Flask secret key
      - FLASK_SESSION_SECRET_KEY=${FLASK_SESSION_SECRET_KEY:-change-this-secret-key-in-production}
      
      # Catalog path
      - CATALOG_PATH=/app/priv/catalog
    volumes:
      # Mount catalog directory for read/write access
      - ./priv/catalog:/app/priv/catalog:rw
    networks:
      - erlangms
    depends_on:
      ems-bus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  erlangms:
    driver: bridge
    name: erlangms
