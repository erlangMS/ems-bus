services:
  # Barramento Erlang (ems-bus)
  ems-bus:
    image: evertonagilar/erlangms:v2026.1
    container_name: ems-bus
    hostname: node01
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2301:2301"
      - "2344:2344"
    volumes:
      # Mount configuration directory
      - ./priv/conf:/app/lib/ems_bus-2.0.26/priv/conf
    networks:
      - erlangms
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2301/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Dashboard
  dashboard:
    image: evertonagilar/erlangms-dashboard:v2026.1
    container_name: ems-dashboard
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      # Authentication credentials (change these in production!)
      - CATALOG_USERNAME=${CATALOG_USERNAME:-admin}
      - CATALOG_PASSWORD=${CATALOG_PASSWORD:-admin123}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      
      # Catalog path
      - CATALOG_PATH=/app/priv/catalog
    volumes:
      # Mount catalog directory for read/write access
      - ./priv/catalog:/app/priv/catalog:rw
    networks:
      - erlangms
    depends_on:
      ems-bus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  erlangms:
    driver: bridge
    name: erlangms
