<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <title>Login Integrado | UnB</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&subset=latin,cyrillic-ext" rel="stylesheet"
        type="text/css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" type="text/css">
    <link href="libs.css" rel="stylesheet" type="text/css">
</head>

<body class="login-page">
    <div class="login-box">
        <div class="logo">
            <a href="https://unb.br"><b>UnB</b></a>
            <small>Autenticação de Usuário</small>
        </div>
        <div class="card">
            <div class="body">
                <form id="sign_in" method="POST">
                    <div class="msg">Informe os dados para autenticação</div>
                    <div class="input-group">
                        <span class="input-group-addon">
                            <i class="material-icons">person</i>
                        </span>
                        <div class="form-line">
                            <input type="text" class="form-control" name="username" id="username" autocomplete="off"
                                placeholder="Usuário" maxlength="32" required autofocus>
                        </div>
                    </div>
                    <div class="input-group">
                        <span class="input-group-addon">
                            <i class="material-icons">lock</i>
                        </span>
                        <div class="form-line">
                            <input type="password" class="form-control" name="pass" id="pass" autocomplete="off"
                                placeholder="Senha" maxlength="32" required>
                        </div>
                    </div>
                    <span id="error"></span>
                    <div class="row">
                        <div class="col-xs-6 p-t-5">
                        </div>
                        <div class="col-xs-6">
                            <button class="btn btn-block bg-green waves-effect" id="enter"
                                type="submit">AUTENTICAR</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="libs.js"></script>
    <script src="login.js"></script>
</body>

</html>
