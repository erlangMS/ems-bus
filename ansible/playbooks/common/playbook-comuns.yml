#
# Playbooks com pacotes essenciais que toda máquina deve ter
# Autor: Everton de Vargas Agilar
# Data: 31/05/2025
#
---
- name: Provisionamento básico das VMs
  hosts: all
  become: yes

  tasks:
    - name: Atualizar cache de pacotes
      apt:
        update_cache: yes

    - name: Instalar pacotes básicos
      apt:
        name:
          - git
          - vim
          - curl
          - wget
          - unzip
          - ntp
          - htop
          - net-tools
          - lsof
          - bash-completion
          - tree
        state: present

    - name: Garantir que o locale pt_BR.UTF-8 esteja gerado (Debian/Ubuntu)
      ansible.builtin.locale_gen:
        name: pt_BR.UTF-8
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Garantir que o locale pt_BR.UTF-8 esteja gerado (RHEL/CentOS)
      ansible.builtin.command: localedef -i pt_BR -f UTF-8 pt_BR.UTF-8
      args:
        creates: /usr/lib/locale/pt_BR.UTF-8
      when: ansible_facts['os_family'] == "RedHat"

    - name: Configurar variáveis de locale no /etc/environment
      ansible.builtin.blockinfile:
        path: /etc/environment
        marker: "# {mark} ANSIBLE LOCALE"
        block: |
          LANG=pt_BR.UTF-8
          LANGUAGE=pt_BR:pt:en

    - name: Aplicar temporariamente o locale na sessão atual
      ansible.builtin.shell: |
        export LANG=pt_BR.UTF-8
        export LANGUAGE=pt_BR:pt:en
      args:
        executable: /bin/bash

    - name: Configurar timezone para America/Sao_Paulo
      ansible.builtin.timezone:
        name: America/Sao_Paulo

    - name: Habilitar e iniciar serviço de NTP
      service:
        name: ntp
        enabled: yes
        state: started

