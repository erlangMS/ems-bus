#
# Playbooks com pacotes essenciais que toda máquina deve ter
# Autor: Everton de Vargas Agilar
# Data: 31/05/2025
#
---
- name: Provisionamento básico das VMs
  hosts: all
  become: true

  tasks:
    - name: Atualizar cache de pacotes
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar pacotes básicos
      ansible.builtin.apt:
        name:
          - git
          - vim
          - curl
          - wget
          - unzip
          - lsof
          - bash-completion
          - tree
        state: present

    - name: Garantir que o locale pt_BR.UTF-8 esteja gerado (Debian/Ubuntu)
      community.general.locale_gen:
        name: pt_BR.UTF-8
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Garantir que o locale pt_BR.UTF-8 esteja gerado (RHEL/CentOS)
      ansible.builtin.command: localedef -i pt_BR -f UTF-8 pt_BR.UTF-8
      args:
        creates: /usr/lib/locale/pt_BR.UTF-8
      when: ansible_facts['os_family'] == "RedHat"

    - name: Configurar variáveis de locale no /etc/environment
      ansible.builtin.blockinfile:
        path: /etc/environment
        marker: "# {mark} ANSIBLE LOCALE"
        block: |
          LANG=pt_BR.UTF-8
          LANGUAGE=pt_BR:pt:en

    - name: Configurar timezone para America/Sao_Paulo
      community.general.timezone:
        name: America/Sao_Paulo
