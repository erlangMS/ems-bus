- name: Limpar cache do Ansible e verificar ambiente
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Remover pasta temporária do Ansible no destino
      ansible.builtin.raw: rm -rf ~/.ansible/tmp
      changed_when: false

    - name: Instalar Six e pacotes de compatibilidade via Raw
      ansible.builtin.raw: >
        DEBIAN_FRONTEND=noninteractive apt-get update &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y
        python3-six python3-setuptools python3-pkg-resources python3-debian python3-apt
      changed_when: false

    - name: Verificar se o six pode ser importado via Raw
      ansible.builtin.raw: python3 -c "import six; print('Six OK')"
      register: six_check
      changed_when: false

    - name: Mostrar resultado do check do Six
      ansible.builtin.debug:
        msg: "{{ six_check.stdout }}"

- name: Provisionar pacotes comuns
  import_playbook: common/playbook-comuns.yml

- name: Provisionar Docker
  import_playbook: common/playbook-docker.yml

- name: Provisionar Erlang
  import_playbook: common/playbook-erlang.yml
