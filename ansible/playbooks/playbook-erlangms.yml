- name: Limpeza e Bootstrap de Dependências (Fix para Ubuntu 24.04)
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Limpeza radical de temporários do Ansible
      ansible.builtin.raw: rm -rf ~/.ansible/tmp
      changed_when: false

    - name: Instalar dependências críticas via Raw (Sem Python)
      ansible.builtin.raw: >
        DEBIAN_FRONTEND=noninteractive apt-get update &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y
        python3-six python3-setuptools python3-pkg-resources python3-debian python3-apt
      changed_when: false

- name: Provisionar pacotes comuns
  import_playbook: common/playbook-comuns.yml

- name: Provisionar Docker
  import_playbook: common/playbook-docker.yml

- name: Provisionar Erlang
  import_playbook: common/playbook-erlang.yml
